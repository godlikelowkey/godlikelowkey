          <div class="trigger-icon">

              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>

        </div>

          <div class="dropdown-inner">
            <!-- Items injected by JS -->

        </div>
      </div>
    </section>

    <section class="plans-section" id="plansSection">
      <!-- Plans injected by JS -->

  </main>

    // ── DOM refs ──
    const customSelect   = document.getElementById('customSelect');
    const selectTrigger  = document.getElementById('selectTrigger');
    const triggerText    = document.getElementById('triggerText');
    const selectDropdown = document.getElementById('selectDropdown');
    const dropdownInner  = selectDropdown.querySelector('.dropdown-inner');
    const plansSection   = document.getElementById('plansSection');
    const logoDot        = document.getElementById('logoDot');

    // ── Build dropdown items ──
    Object.entries(SERVICES).forEach(([key, svc]) => {
      const item = document.createElement('div');
      item.className = 'dropdown-item';
      item.dataset.key = key;
      item.innerHTML = `
        <span class="item-logo">
          <img src="${svc.icon}" alt="${svc.name}" />
        </span>
      `;
      item.addEventListener('click', () => selectService(key));
      dropdownInner.appendChild(item);
    });

    // ── Toggle dropdown ──
    selectTrigger.addEventListener('click', () => {
      customSelect.classList.toggle('open');
    });

    document.addEventListener('click', (e) => {
      if (!customSelect.contains(e.target)) {
        customSelect.classList.remove('open');
      }
    });

    // ── Select a service ──
    function selectService(key) {
      const svc = SERVICES[key];
      customSelect.classList.remove('open');
      triggerText.textContent = svc.name;

      // Update accent color
      document.documentElement.style.setProperty('--accent', svc.color);
      document.documentElement.style.setProperty('--accent-glow', hexToRgba(svc.color, 0.18));
      document.documentElement.style.setProperty('--accent-soft', hexToRgba(svc.color, 0.08));
      logoDot.style.background = svc.color;

      renderPlans(svc);
    }

    // ── Render plans ──
    function renderPlans(svc) {
      plansSection.innerHTML = '';
      plansSection.classList.remove('visible');

      const header = document.createElement('div');
      header.className = 'plans-header';
      header.innerHTML = `
        <div class="service-badge" style="--svc-color:${svc.color}">
          <span class="badge-logo"><img src="${svc.icon}" alt="${svc.name}" /></span>
          <span class="badge-name">${svc.name}</span>
        </div>
        <p class="plans-count">${svc.plans.length} plan${svc.plans.length > 1 ? 's' : ''} available</p>
      `;
      plansSection.appendChild(header);

      const grid = document.createElement('div');
      grid.className = 'plans-grid';

      svc.plans.forEach((plan, i) => {
        const card = document.createElement('div');
        card.className = 'plan-card' + (plan.popular ? ' popular' : '');
        card.style.animationDelay = `${i * 80}ms`;

        const priceStr = plan.price === 0
          ? '<span class="price-amount">Free</span>'
          : `<span class="price-amount">$${plan.price.toFixed(2)}</span><span class="price-period">/${plan.period}</span>`;

        const adsBadge = plan.ads
          ? `<span class="ads-badge ads-yes">
               <svg viewBox="0 0 16 16" fill="currentColor"><path d="M2 2h12v12H2V2zm1 1v10h10V3H3zm2 2h6v1H5V5zm0 2h6v1H5V7zm0 2h4v1H5V9z"/></svg>
               Contains Ads
             </span>`
          : `<span class="ads-badge ads-no">
               <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6"/><line x1="5" y1="5" x2="11" y2="11"/></svg>
               Ad-Free
             </span>`;

        const featuresHTML = plan.features.map(f =>
          `<li class="feature-item">
            <span class="feature-check">
              <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1.5 6 4.5 9 10.5 3"/></svg>
            </span>
            ${f}
          </li>`
        ).join('');

        card.innerHTML = `
          ${plan.popular ? '<div class="popular-tag">Most Popular</div>' : ''}
          <div class="card-top">
            <h3 class="plan-name">${plan.name}</h3>
            ${adsBadge}
          </div>
          <div class="plan-price">${priceStr}</div>
          <ul class="features-list">${featuresHTML}</ul>
        `;

        grid.appendChild(card);
      });

      plansSection.appendChild(grid);

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          plansSection.classList.add('visible');
        });
      });
    }

    // ── Utility ──
    function hexToRgba(hex, alpha) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return `rgba(${r},${g},${b},${alpha})`;
    }
